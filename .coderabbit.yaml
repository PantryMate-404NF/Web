# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: 'ko-KR'

reviews:
  # 초기 팀에서는 실질적인 오류와 유지보수 이슈 중심으로 검토해 과도한 스타일 지적을 줄입니다.
  profile: 'chill'
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_instructions: >
    변경 목적, 사용자 흐름 영향, 백엔드 API 또는 MSW 계약 변경 여부,
    검증이 필요한 위험 요소를 한국어로 간결하게 요약합니다.
  review_status: true
  review_details: false
  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    base_branches:
      - develop
      - main
  tools:
    eslint:
      enabled: true
      config_file: 'eslint.config.mjs'
    github-checks:
      enabled: true
  path_instructions:
    - path: 'src/**/*.{ts,tsx}'
      instructions: >
        TypeScript의 any 우회, 접근성 누락, 로딩·빈 데이터·오류 상태 누락을 검토합니다.
        FSD 의존 방향(app → views → widgets → features → entities → shared)을 지키는지 확인합니다.
    - path: 'src/mocks/**'
      instructions: >
        REST API 명세, API 타입, 요청 함수와 MSW handler의 응답 계약이 함께 갱신됐는지 확인합니다.
    - path: 'src/app/**'
      instructions: >
        라우팅과 전역 설정만 두고, 도메인 또는 페이지 조합 로직이 섞이지 않았는지 확인합니다.
    - path: 'docs/**'
      instructions: >
        제품 규칙, API 계약, 구현 규칙이 서로 모순되지 않는지 확인합니다.

chat:
  auto_reply: true
